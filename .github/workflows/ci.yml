name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://numerology:numerology@127.0.0.1:5432/numerology_test
      TEST_DATABASE_URL: postgresql://numerology:numerology@127.0.0.1:5432/numerology_test
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: numerology_test
          POSTGRES_PASSWORD: numerology
          POSTGRES_USER: numerology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U numerology -d numerology_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
